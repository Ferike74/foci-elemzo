<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportfogadás Elemző Agent | Prémium Platform</title>
    <!-- Supabase JS Client betöltése -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .match-grid {
            display: grid;
            gap: 20px;
        }
        .match-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .league-badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .match-time {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .match-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Legfrissebb Meccselemzések</h1>
    <div id="analyses-container" class="match-grid">
        <p style="text-align: center; color: #94a3b8;">Adatok betöltése...</p>
    </div>
</div>

<script>
    // Supabase kapcsolat konfigurációja
    const SUPABASE_URL = 'https://gyozibfurwsbdutwmgrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sz4cCjpwZ6pFNK8J-3d80Q_T8GfpSUy';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadMatchAnalyses() {
        const container = document.getElementById('analyses-container');
        
        try {
            const { data, error } = await supabaseClient
                .from('match_analyses')
                .select('*')
                .order('id', { ascending: false })
                .limit(10);

            if (error) {
                throw error;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8;">Jelenleg nincsenek elérhető elemzések.</p>';
                return;
            }

            container.innerHTML = '';

            data.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-header">
                        <span class="league-badge">${match.league_name || 'Ismeretlen bajnokság'}</span>
                        <span class="match-time">${match.match_time || ''}</span>
                    </div>
                    <div class="match-title">${match.match_title || 'Mérkőzés'}</div>
                `;
                container.appendChild(card);
            });

        } catch (err) {
            console.error('Hiba történt az adatok lekérésekor:', err);
            container.innerHTML = '<p style="text-align: center; color: #f87171;">Hiba történt az adatok betöltése közben.</p>';
        }
    }

    // Oldal betöltésekor azonnal futtatás
    document.addEventListener('DOMContentLoaded', loadMatchAnalyses);
</script>

</body>
</html>
