<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Európai Ligák Foci Elemzése</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }
        .leagues-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .league-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }
        .league-btn:hover, .league-btn.active {
            background-color: #0369a1;
            border: 1px solid #38bdf8;
        }
        .match-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .league-badge {
            background-color: #0284c7;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .match-time {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .match-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 10px;
        }
        .analysis-content {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Európai Ligák Foci Elemzése</h1>
    
    <div class="leagues-nav">
        <button class="league-btn active" onclick="loadAnalyses('all', this)">Összes Elemzés</button>
        <button class="league-btn" onclick="loadAnalyses('Spanyol La Liga', this)">Spanyol La Liga</button>
        <button class="league-btn" onclick="loadAnalyses('Francia Liga 1', this)">Francia Liga 1</button>
        <button class="league-btn" onclick="loadAnalyses('Német Bundesliga', this)">Német Bundesliga</button>
        <button class="league-btn" onclick="loadAnalyses('Olasz Serie A', this)">Olasz Serie A</button>
        <button class="league-btn" onclick="loadAnalyses('Görög Szuperliga', this)">Görög Szuperliga</button>
        <button class="league-btn" onclick="loadAnalyses('Holland Eredivisie', this)">Holland Eredivisie</button>
        <button class="league-btn" onclick="loadAnalyses('Portugál Liga', this)">Portugál Liga</button>
    </div>

    <div id="analyses-container">
        <p style="text-align: center; color: #94a3b8;">Adatok betöltése...</p>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://gyozibfurwsbdutwmgrl.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_sz4cCjpwZ6pFNK8J-3d80Q_T8GfpSUy';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAnalyses(leagueName, buttonElement) {
        document.querySelectorAll('.league-btn').forEach(btn => btn.classList.remove('active'));
        if (buttonElement) buttonElement.classList.add('active');

        const container = document.getElementById('analyses-container');
        container.innerHTML = '<p style="text-align: center; color: #94a3b8;">Adatok betöltése...</p>';

        try {
            let query = supabaseClient.from('match_analyses').select('*').order('id', { ascending: false });
            
            if (leagueName !== 'all') {
                query = query.eq('league_name', leagueName);
            }

            const { data, error } = await query;

            if (error) throw error;

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #94a3b8;">Jelenleg nincsenek elemzések ebben a kategóriában.</p>`;
                return;
            }

            container.innerHTML = '';

            data.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <div class="match-header">
                        <span class="league-badge">${match.league_name || 'Ismeretlen'}</span>
                        <span class="match-time">${match.match_time || ''}</span>
                    </div>
                    <div class="match-title">${match.match_title || 'Mérkőzés'}</div>
                    <div class="analysis-content">
                        ${match.analysis_desc || 'Részletes elemzés elérhető.'}
                    </div>
                `;
                container.appendChild(card);
            });

        } catch (err) {
            console.error('Hiba az adatok lekérésekor:', err);
            container.innerHTML = '<p style="text-align: center; color: #f87171;">Hiba történt az adatok betöltése közben.</p>';
        }
    }

    // Oldal betöltésekor az összes elemzés betöltése
    document.addEventListener('DOMContentLoaded', () => loadAnalyses('all'));
</script>

</body>
</html>
